name: Volla Algiz OTA Checker

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild even if version matches last_version.txt'
        required: false
        default: false
        type: boolean
      build_ut_dualboot:
        description: 'Build separate Ubuntu Touch dual-boot add-on zip (Slot B)'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Install payload-dumper-go
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzma-dev
          go install github.com/ssut/payload-dumper-go@v0.0.0-20260820001620-05fe59e21c9f
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Write OTA checker script
        run: |
          cat << 'PYEOF' > check_ota.py
          #!/usr/bin/env python3
          """Check Volla OTA server for new stable updates for the Algiz device."""

          import os
          import re
          import sys
          import requests
          from bs4 import BeautifulSoup

          OTA_BASE_URL = "https://ota.volla.tech/"
          DEVICE = "algiz"
          CHANNEL = "stable"
          STATE_FILE = "last_version.txt"

          UPDATE_PATTERN = re.compile(
              r'volla-([\d.]+)-(\d{8})-' + re.escape(CHANNEL) + r'-' + re.escape(DEVICE) + r'-signed\.zip',
              re.IGNORECASE
          )

          def fetch_page(url):
              try:
                  resp = requests.get(url, timeout=60, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                  })
                  resp.raise_for_status()
                  return resp
              except requests.RequestException as e:
                  print(f"Error fetching {url}: {e}")
                  return None

          def parse_html(html):
              soup = BeautifulSoup(html, "html.parser")
              updates = []
              for a_tag in soup.find_all("a", href=True):
                  href = a_tag["href"]
                  filename = href.split("/")[-1]
                  match = UPDATE_PATTERN.search(filename)
                  if match:
                      version_str = match.group(1)
                      date_str = match.group(2)
                      if href.startswith("http"):
                          full_url = href
                      else:
                          full_url = OTA_BASE_URL.rstrip("/") + "/" + href.lstrip("/")
                      updates.append((version_str, date_str, full_url))
              return updates

          def parse_json(data):
              updates = []
              items = data if isinstance(data, list) else data.get("files", data.get("updates", []))
              for item in items:
                  if isinstance(item, dict):
                      name = item.get("name", item.get("url", item.get("filename", "")))
                      url = item.get("url", item.get("download_url", name))
                  else:
                      name = str(item)
                      url = name
                  match = UPDATE_PATTERN.search(name)
                  if match:
                      version_str = match.group(1)
                      date_str = match.group(2)
                      if not url.startswith("http"):
                          url = OTA_BASE_URL.rstrip("/") + "/" + url.lstrip("/")
                      updates.append((version_str, date_str, url))
              return updates

          def get_available_updates():
              resp = fetch_page(OTA_BASE_URL)
              if resp is None:
                  return []
              content_type = resp.headers.get("Content-Type", "")
              if "json" in content_type:
                  try:
                      return parse_json(resp.json())
                  except (ValueError, KeyError):
                      pass
              return parse_html(resp.text)

          def get_last_version():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r") as f:
                      return f.read().strip()
              return ""

          def set_output(name, value):
              github_output = os.environ.get("GITHUB_OUTPUT")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{name}={value}\n")
              else:
                  print(f"::set-output name={name}::{value}")

          def main():
              print("Checking Volla OTA server for stable Algiz updates...")
              updates = get_available_updates()
              if not updates:
                  print("No stable updates found for Algiz.")
                  set_output("new_update", "false")
                  return 0

              updates.sort(key=lambda x: x[1], reverse=True)
              latest_version, latest_date, latest_url = updates[0]
              print(f"Found {len(updates)} stable update(s). Latest: v{latest_version} ({latest_date})")

              force_rebuild = os.environ.get("FORCE_REBUILD", "false").lower() == "true"
              last_version = get_last_version()
              if not force_rebuild and last_version and latest_date <= last_version:
                  print(f"Already processed version {last_version}. No new update.")
                  set_output("new_update", "false")
                  return 0

              print(f"Building update: {latest_url} (force_rebuild={force_rebuild})")
              set_output("new_update", "true")
              set_output("download_url", latest_url)
              set_output("version", latest_version)
              set_output("version_date", latest_date)
              set_output("date_formatted", f"{latest_date[:4]}/{latest_date[4:6]}/{latest_date[6:8]}")
              set_output("android_major", latest_version.split(".")[0])

              with open(STATE_FILE, "w") as f:
                  f.write(latest_date)
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF

      - name: Check for new stable update
        id: check
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: python check_ota.py

      - name: Build dual-boot slot switcher binary (ARM64) & Android APK
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -euo pipefail
          mkdir -p dualboot_artifacts/apk_build/res/drawable dualboot_artifacts/apk_build/src/org/zahedan/dualboot dualboot_artifacts/apk_build/classes dualboot_artifacts/apk_build/dex_out

          # 1. Compile universal static ARM64 A/B slot switcher (CRC32-verified AOSP bootloader_control)
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross linux-libc-dev-arm64-cross zip

          cat << 'CEOF' > dualboot_artifacts/switch_slot.c
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/reboot.h>
          #include <unistd.h>

          #define BOOT_CTRL_OFFSET 2048
          #define BOOT_CTRL_SIZE   32
          #define BOOT_CTRL_MAGIC  0x42414342U

          static uint32_t crc32_le(const uint8_t *buf, size_t len) {
              uint32_t crc = 0xffffffffU;
              for (size_t i = 0; i < len; i++) {
                  crc ^= buf[i];
                  for (int j = 0; j < 8; j++) {
                      crc = (crc >> 1) ^ (0xedb88320U & -(crc & 1U));
                  }
              }
              return ~crc;
          }

          static uint32_t read_le32(const uint8_t *p) {
              return (uint32_t)p[0] | ((uint32_t)p[1] << 8) |
                     ((uint32_t)p[2] << 16) | ((uint32_t)p[3] << 24);
          }

          static void write_le32(uint8_t *p, uint32_t v) {
              p[0] = (uint8_t)(v & 0xffU);
              p[1] = (uint8_t)((v >> 8) & 0xffU);
              p[2] = (uint8_t)((v >> 16) & 0xffU);
              p[3] = (uint8_t)((v >> 24) & 0xffU);
          }

          static int find_and_open_misc(int flags, const char **chosen_path, uint8_t out_buf[BOOT_CTRL_SIZE]) {
              const char *candidates[] = {
                  "/dev/block/by-name/para",
                  "/dev/block/by-name/misc",
                  "/dev/disk/by-partlabel/para",
                  "/dev/disk/by-partlabel/misc",
                  NULL
              };
              for (int i = 0; candidates[i] != NULL; i++) {
                  int fd = open(candidates[i], flags);
                  if (fd < 0) continue;
                  uint8_t buf[BOOT_CTRL_SIZE];
                  ssize_t n = pread(fd, buf, BOOT_CTRL_SIZE, BOOT_CTRL_OFFSET);
                  if (n == BOOT_CTRL_SIZE) {
                      uint32_t magic = read_le32(buf + 4);
                      uint8_t ver = buf[8];
                      uint8_t nb_slot = buf[9] & 0x07U;
                      uint32_t stored_crc = read_le32(buf + 28);
                      uint32_t calc_crc = crc32_le(buf, 28);
                      if (magic == BOOT_CTRL_MAGIC && ver == 1 && nb_slot >= 2 && stored_crc == calc_crc) {
                          memcpy(out_buf, buf, BOOT_CTRL_SIZE);
                          *chosen_path = candidates[i];
                          return fd;
                      }
                  }
                  close(fd);
              }
              return -1;
          }

          static void print_status(const char *path, const uint8_t buf[BOOT_CTRL_SIZE]) {
              printf("Partition: %s\n", path);
              printf("Suffix: %.4s | Magic: 0x%08x | Version: %u | Slots: %u\n",
                     (const char *)buf, read_le32(buf + 4), buf[8], buf[9] & 0x07U);
              for (int s = 0; s < 2; s++) {
                  uint8_t b0 = buf[12 + s * 2];
                  uint8_t b1 = buf[12 + s * 2 + 1];
                  printf("Slot %d (_%c): priority=%u tries=%u successful=%u corrupted=%u\n",
                         s, s == 0 ? 'a' : 'b',
                         b0 & 0x0fU, (b0 >> 4) & 0x07U, (b0 >> 7) & 0x01U, b1 & 0x01U);
              }
          }

          static void do_reboot(void) {
              sync();
              if (access("/system/bin/svc", X_OK) == 0) {
                  if (system("/system/bin/svc power reboot") == 0) return;
              }
              if (access("/bin/systemctl", X_OK) == 0) {
                  if (system("/bin/systemctl reboot") == 0) return;
              }
              if (access("/usr/bin/systemctl", X_OK) == 0) {
                  if (system("/usr/bin/systemctl reboot") == 0) return;
              }
              if (access("/sbin/reboot", X_OK) == 0) {
                  if (system("/sbin/reboot") == 0) return;
              }
              if (access("/system/bin/reboot", X_OK) == 0) {
                  if (system("/system/bin/reboot") == 0) return;
              }
              reboot(RB_AUTOBOOT);
          }

          int main(int argc, char **argv) {
              if (argc < 2) {
                  fprintf(stderr, "Usage: %s <0|1|--status> [--no-reboot]\n", argv[0]);
                  return 2;
              }
              const char *path = NULL;
              uint8_t buf[BOOT_CTRL_SIZE];

              if (strcmp(argv[1], "--status") == 0) {
                  int fd = find_and_open_misc(O_RDONLY, &path, buf);
                  if (fd < 0) {
                      fprintf(stderr, "ERROR: Valid AOSP bootloader_control (BCAB + CRC32) not found in para/misc.\n");
                      return 1;
                  }
                  print_status(path, buf);
                  close(fd);
                  return 0;
              }

              int target = -1;
              if (strcmp(argv[1], "0") == 0 || strcmp(argv[1], "a") == 0 || strcmp(argv[1], "_a") == 0) target = 0;
              else if (strcmp(argv[1], "1") == 0 || strcmp(argv[1], "b") == 0 || strcmp(argv[1], "_b") == 0) target = 1;
              else {
                  fprintf(stderr, "ERROR: Invalid slot '%s' (use 0 or 1).\n", argv[1]);
                  return 2;
              }

              int no_reboot = (argc >= 3 && strcmp(argv[2], "--no-reboot") == 0);
              int fd = find_and_open_misc(O_RDWR | O_SYNC, &path, buf);
              if (fd < 0) {
                  fprintf(stderr, "ERROR: Cannot open/verify AOSP bootloader_control in para/misc (need root?).\n");
                  return 1;
              }

              int other = 1 - target;
              memcpy(buf, target == 0 ? "_a\0\0" : "_b\0\0", 4);

              /* Set target slot highest priority (15), tries=7, successful=1 so Linux OS never rolls back */
              buf[12 + target * 2] = (uint8_t)((1U << 7) | (7U << 4) | 15U);
              buf[12 + target * 2 + 1] = 0U;

              /* Keep other slot permanently bootable as secondary (priority=14) */
              buf[12 + other * 2] = (uint8_t)((1U << 7) | (7U << 4) | 14U);
              buf[12 + other * 2 + 1] = 0U;

              write_le32(buf + 28, crc32_le(buf, 28));

              if (pwrite(fd, buf, BOOT_CTRL_SIZE, BOOT_CTRL_OFFSET) != BOOT_CTRL_SIZE) {
                  perror("ERROR: pwrite failed");
                  close(fd);
                  return 1;
              }
              fsync(fd);
              close(fd);
              sync();

              printf("Active boot slot switched to %d (_%c) on %s.\n", target, target == 0 ? 'a' : 'b', path);
              if (!no_reboot) {
                  do_reboot();
              }
              return 0;
          }
          CEOF

          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -static -o dualboot_artifacts/switch-slot dualboot_artifacts/switch_slot.c
          aarch64-linux-gnu-strip dualboot_artifacts/switch-slot
          file dualboot_artifacts/switch-slot
          ls -lh dualboot_artifacts/switch-slot

          # 2. Build SwitchToLinux.apk (Launcher Icon + Quick Settings Tile) using preinstalled Android SDK
          ANDROID_SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT_DIR=$(ls -d "$ANDROID_SDK"/build-tools/* 2>/dev/null | sort -V | tail -n 1)
          PLAT_JAR=$(ls "$ANDROID_SDK"/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -n 1)
          echo "Using build-tools: $BT_DIR"
          echo "Using android.jar: $PLAT_JAR"
          [ -x "$BT_DIR/aapt2" ] && [ -f "$PLAT_JAR" ] || { echo "FATAL: Preinstalled Android SDK not found"; exit 1; }

          cd dualboot_artifacts/apk_build
          mkdir -p res/values

          # The launcher activity only hosts a dialog. Theme.Translucent.NoTitleBar paints the status bar
          # solid black behind the dialog, so use a DeviceDefault theme with transparent system bars.
          cat << 'XMLEOF' > res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="DialogHost" parent="@android:style/Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowIsTranslucent">true</item>
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowDrawsSystemBarBackgrounds">true</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
                  <item name="android:enforceStatusBarContrast">false</item>
                  <item name="android:enforceNavigationBarContrast">false</item>
                  <item name="android:windowAnimationStyle">@null</item>
              </style>
          </resources>
          XMLEOF

          cat << 'XMLEOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="org.zahedan.dualboot"
              android:versionCode="1"
              android:versionName="1.0">
              <uses-sdk android:minSdkVersion="29" android:targetSdkVersion="34" />
              <application
                  android:label="Switch to Linux"
                  android:icon="@drawable/ic_switch_linux"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/DialogHost">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".SwitchTileService"
                      android:exported="true"
                      android:label="Switch to Linux"
                      android:icon="@drawable/ic_tile_switch"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          XMLEOF

          cat << 'XMLEOF' > res/drawable/ic_switch_linux.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#E95420"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M6.99,11L3,15l3.99,4v-3H14v-2H6.99v-3zM21,9l-3.99,-4v3H10v2h7.01v3L21,9z"/>
          </vector>
          XMLEOF

          # Quick Settings tiles are tinted by the system (only the alpha channel is used), so the
          # colored launcher icon would turn into a plain disc. This variant cuts the arrows out of
          # the circle (evenOdd) so the tile shows the same icon as the app.
          cat << 'XMLEOF' > res/drawable/ic_tile_switch.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:fillType="evenOdd"
                  android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zM6.99,11L3,15l3.99,4v-3H14v-2H6.99v-3zM21,9l-3.99,-4v3H10v2h7.01v3L21,9z"/>
          </vector>
          XMLEOF

          cat << 'JAVAEOF' > src/org/zahedan/dualboot/SwitchHelper.java
          package org.zahedan.dualboot;

          import java.io.BufferedReader;
          import java.io.InputStreamReader;

          final class SwitchHelper {
              private SwitchHelper() {}

              // Falls back to a copy in /data/local/tmp when the exec bit of /system/bin/switch-slot was lost in the repack.
              private static final String CMD =
                  "B=/system/bin/switch-slot; "
                  + "[ -x $B ] || { cp $B /data/local/tmp/switch-slot "
                  + "&& chmod 755 /data/local/tmp/switch-slot "
                  + "&& B=/data/local/tmp/switch-slot; }; "
                  + "$B 1";

              /** Switches to Slot B and reboots. Returns null on success, otherwise a message to show. */
              static String run() {
                  StringBuilder out = new StringBuilder();
                  int code = -1;
                  try {
                      Process p = new ProcessBuilder("su", "-c", CMD).redirectErrorStream(true).start();
                      try (BufferedReader br = new BufferedReader(new InputStreamReader(p.getInputStream()))) {
                          String line;
                          while ((line = br.readLine()) != null) {
                              out.append(line).append("\n");
                          }
                      }
                      code = p.waitFor();
                  } catch (Exception e) {
                      out.append(e.getMessage());
                  }
                  if (code == 0) return null;
                  String details = out.toString().trim();
                  return "One-tap switching from Android requires root (KernelSU/Magisk).\n\n"
                      + "Without root, switch via Recovery (Reboot > Slot B) or Fastboot (fastboot set_active b).\n\n"
                      + (details.isEmpty() ? "" : "Details: " + details);
              }
          }
          JAVAEOF

          cat << 'JAVAEOF' > src/org/zahedan/dualboot/MainActivity.java
          package org.zahedan.dualboot;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.os.Bundle;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                      .setTitle("Switch to Linux Mobile")
                      .setMessage("Switch active boot slot to Slot B (Ubuntu Touch / Linux Mobile) and reboot now?")
                      .setCancelable(true)
                      .setNegativeButton("Cancel", (d, w) -> finish())
                      .setOnCancelListener(d -> finish())
                      .setPositiveButton("Reboot to Linux", (d, w) -> triggerSwitch())
                      .show();
              }

              private void triggerSwitch() {
                  new Thread(() -> {
                      final String error = SwitchHelper.run();
                      runOnUiThread(() -> {
                          if (error != null) {
                              new AlertDialog.Builder(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                                  .setTitle("Root Access Required")
                                  .setMessage(error)
                                  .setPositiveButton("OK", (d, w) -> finish())
                                  .setOnCancelListener(d -> finish())
                                  .show();
                          } else {
                              finish();
                          }
                      });
                  }).start();
              }
          }
          JAVAEOF

          cat << 'JAVAEOF' > src/org/zahedan/dualboot/SwitchTileService.java
          package org.zahedan.dualboot;

          import android.graphics.drawable.Icon;
          import android.os.Handler;
          import android.os.Looper;
          import android.service.quicksettings.Tile;
          import android.service.quicksettings.TileService;
          import android.widget.Toast;

          // Two-tap confirmation done inside the tile itself: the first tap arms the tile ("Tap again to
          // confirm"), the second tap within a few seconds switches to Slot B and reboots. No dialog and
          // no activity are started, so the notification shade / status bar is never collapsed, re-opened
          // or covered by anything.
          public class SwitchTileService extends TileService {
              private static final long CONFIRM_WINDOW_MS = 4000;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean armed = false;
              private final Runnable disarm = () -> {
                  armed = false;
                  render(null);
              };

              @Override
              public void onStartListening() {
                  super.onStartListening();
                  handler.removeCallbacks(disarm);
                  armed = false;
                  render(null);
              }

              @Override
              public void onStopListening() {
                  handler.removeCallbacks(disarm);
                  armed = false;
                  super.onStopListening();
              }

              @Override
              public void onClick() {
                  super.onClick();
                  if (isLocked()) {
                      unlockAndRun(this::handleClick);
                  } else {
                      handleClick();
                  }
              }

              private void handleClick() {
                  handler.removeCallbacks(disarm);
                  if (!armed) {
                      armed = true;
                      render("Tap again to confirm");
                      handler.postDelayed(disarm, CONFIRM_WINDOW_MS);
                      return;
                  }
                  armed = false;
                  render("Switching...");
                  new Thread(() -> {
                      final String error = SwitchHelper.run();
                      if (error != null) {
                          handler.post(() -> {
                              render(null);
                              Toast.makeText(getApplicationContext(),
                                  "Root access required (KernelSU/Magisk). Use Recovery or fastboot instead.",
                                  Toast.LENGTH_LONG).show();
                          });
                      }
                  }).start();
              }

              private void render(String subtitle) {
                  Tile tile = getQsTile();
                  if (tile == null) return;
                  tile.setState(armed || subtitle != null ? Tile.STATE_ACTIVE : Tile.STATE_INACTIVE);
                  tile.setLabel("Switch to Linux");
                  tile.setSubtitle(subtitle);
                  tile.setIcon(Icon.createWithResource(this, R.drawable.ic_tile_switch));
                  tile.updateTile();
              }
          }
          JAVAEOF

          "$BT_DIR/aapt2" compile --dir res -o compiled_res.zip
          "$BT_DIR/aapt2" link -o app-unsigned.apk -I "$PLAT_JAR" --manifest AndroidManifest.xml compiled_res.zip --java src
          javac -source 11 -target 11 -classpath "$PLAT_JAR" -d classes src/org/zahedan/dualboot/*.java
          "$BT_DIR/d8" --min-api 29 --lib "$PLAT_JAR" --output dex_out $(find classes -name '*.class')
          zip -j -0 app-unsigned.apk dex_out/classes.dex
          "$BT_DIR/zipalign" -f -p 4 app-unsigned.apk app-aligned.apk
          keytool -genkeypair -v -keystore release.jks -storepass android -keypass android \
            -alias switch -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=ZahedanDualBoot"
          "$BT_DIR/apksigner" sign --ks release.jks --ks-pass pass:android --key-pass pass:android \
            --out ../SwitchToLinux.apk app-aligned.apk
          "$BT_DIR/apksigner" verify ../SwitchToLinux.apk
          cd ../..
          rm -rf dualboot_artifacts/apk_build
          ls -lh dualboot_artifacts/

      - name: Download OTA zip
        if: steps.check.outputs.new_update == 'true'
        run: |
          echo "Downloading ${{ steps.check.outputs.download_url }} ..."
          curl -fL --retry 3 --retry-delay 10 -o ota.zip "${{ steps.check.outputs.download_url }}"
          echo "Download size: $(du -h ota.zip | cut -f1)"

      - name: Dump OTA payload
        if: steps.check.outputs.new_update == 'true'
        run: |
          mkdir -p extracted
          "$HOME/go/bin/payload-dumper-go" -o extracted ota.zip
          echo "Extracted files:"
          ls -lh extracted/

      - name: Free space - remove OTA zip
        if: steps.check.outputs.new_update == 'true'
        run: rm -f ota.zip

      - name: Free disk space
        if: steps.check.outputs.new_update == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h /

      - name: Install Android Image Tools dependencies
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -e
          export TERM=xterm-256color
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            android-sdk-libsparse-utils \
            build-essential \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            fuse3 \
            e2fsprogs \
            pv \
            liblz4-dev \
            uuid-dev \
            libfuse3-dev \
            f2fs-tools \
            fuse2fs \
            attr \
            zlib1g-dev \
            rsync \
            file \
            p7zip-full \
            zip
          sudo modprobe fuse || true
          sudo modprobe erofs || true
          if ! command -v mkfs.erofs >/dev/null || ! command -v erofsfuse >/dev/null; then
            git clone --depth 1 https://github.com/erofs/erofs-utils.git /tmp/erofs-utils
            cd /tmp/erofs-utils
            ./autogen.sh
            ./configure --enable-fuse --enable-multithreading
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
            cd "${GITHUB_WORKSPACE}"
            rm -rf /tmp/erofs-utils
          fi
          mkfs.erofs --help >/dev/null
          command -v simg2img
          command -v img2simg
          df -h /

      - name: Clone Android Image Tools
        if: steps.check.outputs.new_update == 'true'
        run: git clone --branch v4 --depth 1 https://github.com/ravindu644/Android_Image_Tools.git

      - name: Patch props, remove stock Updater/Multi-Boot, and inject Switch to Linux
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -euo pipefail
          export TERM=xterm-256color
          AIT="Android_Image_Tools"

          find_image() {
            for suffix in "_a" ""; do
              [ -f "extracted/$1${suffix}.img" ] && { echo "extracted/$1${suffix}.img"; return 0; }
            done
            return 1
          }

          ensure_raw() {
            local f="$1"
            if file "$f" | grep -qi 'Android sparse'; then
              echo "Converting sparse $f -> raw"
              simg2img "$f" "${f}.raw"
              mv -f "${f}.raw" "$f"
            fi
            if file "$f" | grep -qi 'Android sparse'; then
              echo "FATAL: $f is still a sparse image"
              exit 1
            fi
          }

          write_conf() {
            local path="$1"
            shift
            : > "$path"
            for line in "$@"; do
              printf '%s\n' "$line" >> "$path"
            done
            echo "Wrote $path:"
            cat "$path"
          }

          mkdir -p "$AIT/INPUT_IMAGES" "$AIT/CONFIGS" "$AIT/REPACKED_IMAGES" "$AIT/EXTRACTED_IMAGES"

          declare -A SRC_PATH
          for part in system product system_ext; do
            src=$(find_image "$part") || { echo "FATAL: ${part}.img not found"; exit 1; }
            SRC_PATH[$part]="$src"
            orig_size=$(stat -c%s "$src")
            echo "Source $part: $src ($orig_size bytes)  $(file -b "$src")"
            ensure_raw "$src"
            cp -f "$src" "$AIT/INPUT_IMAGES/${part}.img"
          done

          cd "$AIT"

          for part in system product system_ext; do
            write_conf "CONFIGS/unpack_${part}.conf" \
              "ACTION=unpack" \
              "INPUT_IMAGE=${part}.img" \
              "EXTRACT_DIR=extracted_${part}"
            sudo --preserve-env=TERM ./android_image_tools.sh --conf="CONFIGS/unpack_${part}.conf"
          done

          while IFS= read -r f; do
            sudo sed -i -E 's/^(ro\.volla\.build\.version=.*-)algiz$/\1By @Itis_Sajjad/' "$f"
          done < <(sudo grep -RIl --include='*.prop' '^ro\.volla\.build\.version=' EXTRACTED_IMAGES/extracted_system || true)

          while IFS= read -r f; do
            sudo sed -i -E 's/^(ro\.lineage\.version=.*-)algiz$/\1By @Itis_Sajjad/' "$f"
          done < <(sudo grep -RIl --include='*.prop' '^ro\.lineage\.version=' EXTRACTED_IMAGES/extracted_product EXTRACTED_IMAGES/extracted_system || true)

          echo "Patched version props:"
          sudo grep -R --include='*.prop' -nE 'ro\.(volla\.build|lineage)\.version=' EXTRACTED_IMAGES/extracted_system EXTRACTED_IMAGES/extracted_product || true

          # Remove stock Updater and stock Volla Multi-Boot Manager (flashing Volla lk bricks Daria Bond)
          echo "Removing stock Updater and stock Multi-Boot/BootManager apps:"
          sudo find EXTRACTED_IMAGES/extracted_system_ext EXTRACTED_IMAGES/extracted_system EXTRACTED_IMAGES/extracted_product \
            -type d \( \
              -path '*/priv-app/Updater' -o \
              -ipath '*/priv-app/*bootmanager*' -o \
              -ipath '*/app/*bootmanager*' -o \
              -ipath '*/priv-app/*multiboot*' -o \
              -ipath '*/app/*multiboot*' -o \
              -ipath '*/priv-app/*abm*' \
            \) -prune -print -exec rm -rf {} + 2>/dev/null || true

          # Second pass: the app folder may have any name, so also match by package name / app label.
          # NOTE: this must not rely on the Android SDK (aapt2): the "Free disk space" step above deletes
          # /usr/local/lib/android, so the old aapt2 based pass silently never ran. The scan below only
          # needs python3 and looks into AndroidManifest.xml (package name) and resources.arsc (labels).
          cat << 'PYEOF' > ../remove_bootmanager.py
          import os
          import shutil
          import sys
          import zipfile

          PKG_PATTERNS = (b"bootmanager", b"multiboot", b"multi-boot", b"bootset")
          LABEL_PATTERNS = (b"volla boot manager", b"multi-boot manager", b"multiboot manager")
          PROTECTED_DIRS = {"settings", "settingsintelligence", "systemui", "framework-res", "volladialer", "launcher3", "launcher"}

          def ascii_lower(data):
              # Binary XML / arsc strings are UTF-8 or UTF-16LE; dropping NUL bytes turns both into plain ASCII.
              return data.replace(b"\x00", b"").lower()

          def classify(apk):
              try:
                  with zipfile.ZipFile(apk) as z:
                      names = set(z.namelist())
                      manifest = ascii_lower(z.read("AndroidManifest.xml")) if "AndroidManifest.xml" in names else b""
                      arsc = ascii_lower(z.read("resources.arsc")) if "resources.arsc" in names else b""
              except Exception as exc:
                  print("  (cannot read %s: %s)" % (apk, exc))
                  return None
              for p in PKG_PATTERNS:
                  if p in manifest:
                      return "manifest contains '%s'" % p.decode()
              for p in LABEL_PATTERNS:
                  if p in arsc:
                      return "label contains '%s'" % p.decode()
              return None

          def find_apks(roots):
              for root in roots:
                  for dirpath, _dirs, files in os.walk(root):
                      parts = dirpath.replace("\\", "/").split("/")
                      if "app" not in parts and "priv-app" not in parts:
                          continue
                      for f in files:
                          if f.endswith(".apk"):
                              yield os.path.join(dirpath, f)

          def main():
              mode = sys.argv[1]
              roots = sys.argv[2:]
              found = 0
              for apk in find_apks(roots):
                  parent = os.path.basename(os.path.dirname(apk)).lower()
                  if parent in PROTECTED_DIRS:
                      continue
                  why = classify(apk)
                  if not why:
                      continue
                  found += 1
                  print("%s %s  (%s)" % ("MATCH" if mode == "check" else "Removing", apk, why))
                  if mode == "remove":
                      apk_dir = os.path.dirname(apk)
                      if os.path.basename(apk_dir) in ("app", "priv-app"):
                          os.remove(apk)
                      else:
                          shutil.rmtree(apk_dir)
              if mode == "remove":
                  # Leftover permission / sysconfig files of the removed apps are harmless but confusing.
                  for root in roots:
                      for dirpath, _dirs, files in os.walk(root):
                          if "/etc/" not in dirpath.replace("\\", "/") + "/":
                              continue
                          for f in files:
                              low = f.lower()
                              if any(k in low for k in ("bootmanager", "multiboot", "multi-boot")):
                                  p = os.path.join(dirpath, f)
                                  print("Removing %s" % p)
                                  os.remove(p)
              print("%s: %d apk(s)" % (mode, found))
              return found

          if __name__ == "__main__":
              sys.exit(0 if main() >= 0 else 1)
          PYEOF
          BM_ROOTS="EXTRACTED_IMAGES/extracted_system_ext EXTRACTED_IMAGES/extracted_system EXTRACTED_IMAGES/extracted_product"
          # shellcheck disable=SC2086
          sudo python3 -I ../remove_bootmanager.py remove $BM_ROOTS

          echo "Verifying that no Boot Manager apk is left:"
          # shellcheck disable=SC2086
          left=$(sudo python3 -I ../remove_bootmanager.py check $BM_ROOTS | grep -c '^MATCH' || true)
          if [ "${left:-0}" -ne 0 ]; then
            echo "FATAL: Boot Manager apk(s) are still present"
            exit 1
          fi
          echo "Apps/folders mentioning boot, volla or ubports (for debugging):"
          sudo find $BM_ROOTS -type f -name '*.apk' \( -path '*/app/*' -o -path '*/priv-app/*' \) 2>/dev/null \
            | grep -iE 'boot|volla|ubports|multi' || true

          # Inject universal /system/bin/switch-slot binary
          SYS_BIN="EXTRACTED_IMAGES/extracted_system/system/bin"
          [ -d "$SYS_BIN" ] || SYS_BIN="EXTRACTED_IMAGES/extracted_system/bin"
          sudo install -m 0755 -o 0 -g 0 ../dualboot_artifacts/switch-slot "$SYS_BIN/switch-slot"
          echo "Installed switch-slot -> $SYS_BIN/switch-slot"

          # Inject preinstalled SwitchToLinux.apk (Launcher icon + Quick Settings tile)
          APP_BASE="EXTRACTED_IMAGES/extracted_product/app"
          [ -d "$APP_BASE" ] || APP_BASE="EXTRACTED_IMAGES/extracted_system/system/app"
          [ -d "$APP_BASE" ] || APP_BASE="EXTRACTED_IMAGES/extracted_system/app"
          sudo install -d -m 0755 -o 0 -g 0 "$APP_BASE/SwitchToLinux"
          sudo install -m 0644 -o 0 -g 0 ../dualboot_artifacts/SwitchToLinux.apk "$APP_BASE/SwitchToLinux/SwitchToLinux.apk"
          echo "Installed SwitchToLinux.apk -> $APP_BASE/SwitchToLinux/SwitchToLinux.apk"

          for part in system product system_ext; do
            meta="EXTRACTED_IMAGES/extracted_${part}/.repack_info/metadata.txt"
            fs="erofs"
            if [ -f "$meta" ]; then
              echo "----- $part metadata -----"
              cat "$meta"
              detected=$(grep -E '^FILESYSTEM_TYPE=' "$meta" | cut -d= -f2- | tr -d '[:space:]' | tr 'A-Z' 'a-z' || true)
              case "$detected" in
                ext4|erofs|f2fs) fs="$detected" ;;
              esac
              mount_method=$(grep -E '^MOUNT_METHOD=' "$meta" | cut -d= -f2- | tr -d '[:space:]' || true)
              if [ "$mount_method" = "fuse" ]; then
                echo "WARNING: $part was unpacked via FUSE; SELinux xattrs may be incomplete"
              fi
            else
              echo "WARNING: no metadata for $part, defaulting to erofs"
            fi
            echo "Repacking $part as $fs (same as original), raw (not sparse)"

            if [ "$fs" = "ext4" ]; then
              write_conf "CONFIGS/repack_${part}.conf" \
                "ACTION=repack" \
                "SOURCE_DIR=extracted_${part}" \
                "OUTPUT_IMAGE=${part}_new.img" \
                "FILESYSTEM=ext4" \
                "MODE=strict" \
                "CREATE_SPARSE_IMAGE=false"
            else
              write_conf "CONFIGS/repack_${part}.conf" \
                "ACTION=repack" \
                "SOURCE_DIR=extracted_${part}" \
                "OUTPUT_IMAGE=${part}_new.img" \
                "FILESYSTEM=erofs" \
                "COMPRESSION_MODE=lz4hc" \
                "COMPRESSION_LEVEL=9" \
                "CREATE_SPARSE_IMAGE=false"
            fi
            sudo --preserve-env=TERM ./android_image_tools.sh --conf="CONFIGS/repack_${part}.conf"
          done

          cd ..

          for part in system product system_ext; do
            dest="${SRC_PATH[$part]}"
            new=""
            for cand in \
              "$AIT/REPACKED_IMAGES/${part}_new.img" \
              "$AIT/REPACKED_IMAGES/${part}_new.sparse.img"; do
              [ -f "$cand" ] && { new="$cand"; break; }
            done
            [ -n "$new" ] || { echo "FATAL: repacked $part not found"; ls -lh "$AIT/REPACKED_IMAGES" || true; exit 1; }
            ensure_raw "$new"
            orig_size=$(stat -c%s "$dest")
            new_size=$(stat -c%s "$new")
            echo "$part orig=$orig_size new=$new_size file=$(file -b "$new")"
            if [ "$new_size" -lt 1048576 ]; then
              echo "FATAL: $part repack is tiny ($new_size bytes) — likely a sparse/header blob"
              exit 1
            fi
            cp -f "$new" "$dest"
          done

          echo "Patched images:"
          ls -lh extracted/system*.img extracted/product*.img extracted/system_ext*.img

          sudo rm -rf "$AIT"
          df -h /

      - name: Install lpmake
        if: steps.check.outputs.new_update == 'true'
        run: |
          curl -fL -o lpmake "https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpmake"
          chmod +x lpmake
          ./lpmake --help || true

      - name: Build dual-boot ready super image (Slot A Full + Slot B Linux HAL)
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -euo pipefail
          find_image() {
            for suffix in "_a" ""; do
              [ -f "extracted/$1${suffix}.img" ] && { echo "extracted/$1${suffix}.img"; return 0; }
            done
            return 1
          }
          align_up_4k() {
            echo $(( (($1 + 4095) / 4096) * 4096 ))
          }

          SUPER_SIZE=7516192768
          RESERVE=4194304
          SLOT_B_HAL_PARTS="odm_dlkm system_dlkm vendor vendor_dlkm"

          SLOT_A_USED=0
          SLOT_B_USED=0
          declare -A PART_IMG PART_SIZE

          for p in odm_dlkm product system system_dlkm system_ext vendor vendor_dlkm; do
            img=$(find_image "$p" || true)
            if [ -n "$img" ]; then
              sz=$(stat -c%s "$img")
              PART_IMG[$p]="$img"
              PART_SIZE[$p]="$sz"
              SLOT_A_USED=$((SLOT_A_USED + $(align_up_4k "$sz")))
              if [[ " $SLOT_B_HAL_PARTS " == *" $p "* ]]; then
                SLOT_B_USED=$((SLOT_B_USED + $(align_up_4k "$sz")))
              fi
            fi
          done

          if [ "$SLOT_B_USED" -gt 0 ]; then
            GROUP_B_SIZE=$((SLOT_B_USED + RESERVE))
          else
            GROUP_B_SIZE=$RESERVE
          fi
          GROUP_A_SIZE=$(( ((SUPER_SIZE - RESERVE - GROUP_B_SIZE) / 4096) * 4096 ))

          echo "SUPER_SIZE=$SUPER_SIZE"
          echo "SLOT_A_USED=$SLOT_A_USED (GROUP_A_SIZE=$GROUP_A_SIZE)"
          echo "SLOT_B_USED=$SLOT_B_USED (GROUP_B_SIZE=$GROUP_B_SIZE)"

          if [ "$SLOT_A_USED" -gt "$GROUP_A_SIZE" ] || [ "$((GROUP_A_SIZE + GROUP_B_SIZE))" -gt "$((SUPER_SIZE - RESERVE))" ]; then
            echo "FATAL: Dynamic partitions exceed SUPER_SIZE with Slot B HAL mirroring enabled"
            exit 1
          fi

          ARGS="--group mtk_dynamic_partitions_a:${GROUP_A_SIZE} --group mtk_dynamic_partitions_b:${GROUP_B_SIZE}"
          for p in odm_dlkm product system system_dlkm system_ext vendor vendor_dlkm; do
            img="${PART_IMG[$p]:-}"
            sz="${PART_SIZE[$p]:-0}"
            if [ -z "$img" ]; then
              echo "WARNING: $p missing — emitting empty _a/_b entries"
              ARGS="$ARGS --partition ${p}_a:none:0:mtk_dynamic_partitions_a"
              ARGS="$ARGS --partition ${p}_b:none:0:mtk_dynamic_partitions_b"
              continue
            fi
            echo "Using $img ($sz bytes) -> ${p}_a"
            ARGS="$ARGS --partition ${p}_a:none:${sz}:mtk_dynamic_partitions_a --image ${p}_a=${img}"
            if [[ " $SLOT_B_HAL_PARTS " == *" $p "* ]]; then
              echo "Mirroring $img ($sz bytes) -> ${p}_b (Linux Mobile Dual-Boot HAL)"
              ARGS="$ARGS --partition ${p}_b:none:${sz}:mtk_dynamic_partitions_b --image ${p}_b=${img}"
            else
              ARGS="$ARGS --partition ${p}_b:none:0:mtk_dynamic_partitions_b"
            fi
          done

          ./lpmake \
            --metadata-size 65536 \
            --metadata-slots 3 \
            --device-size "${SUPER_SIZE}" \
            --super-name super \
            $ARGS \
            --virtual-ab \
            --sparse \
            --output super.img
          echo "===== lpmake done, super.img size: $(stat -c%s super.img) ====="

      - name: Download latest platform-tools (Windows)
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 10 -o platform-tools-windows.zip \
            "https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          unzip -q platform-tools-windows.zip
          if [ ! -f platform-tools/fastboot.exe ]; then
            echo "FATAL: platform-tools/fastboot.exe not found after extraction"
            exit 1
          fi
          rm -f platform-tools-windows.zip
          echo "platform-tools contents:"
          ls -lh platform-tools/ | head -n 30

      - name: Prepare main VollaOS flash package
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -euo pipefail
          mkdir -p flash_package

          if [ ! -s super.img ]; then
            echo "FATAL: super.img was not built"
            exit 1
          fi
          cp -f super.img flash_package/super.img

          for img in vbmeta-disabled lk preloader; do
            if [ ! -s "prebuilt/${img}.img" ]; then
              echo "FATAL: prebuilt/${img}.img is missing from the repository"
              exit 1
            fi
            cp -f "prebuilt/${img}.img" "flash_package/${img}.img"
          done

          PAYLOAD_PARTS=(md1img spmfw pi_img dpm scp sspm mcupm cam_vpu1 cam_vpu2 cam_vpu3 gz tee boot dtbo init_boot vendor_boot)

          missing=0
          for part in "${PAYLOAD_PARTS[@]}"; do
            src=""
            for cand in \
              "extracted/${part}.img" "extracted/${part}_a.img" "extracted/${part}_b.img" \
              "extracted/${part}.bin" "extracted/${part}_a.bin" "extracted/${part}_b.bin"; do
              if [ -f "$cand" ]; then src="$cand"; break; fi
            done
            if [ -z "$src" ]; then
              echo "FATAL: required image not in OTA payload: ${part}"
              missing=1
              continue
            fi
            cp -f "$src" "flash_package/${part}.img"
            echo "Packed $(basename "$src") -> ${part}.img"
          done
          if [ "$missing" = "1" ]; then
            echo "Extracted files:"
            ls -lh extracted/ || true
            exit 1
          fi

          cp -f flash/commands.txt flash/flash_all.sh flash/flash_all.bat flash_package/
          chmod +x flash_package/flash_all.sh
          cp -a platform-tools flash_package/platform-tools

          echo "Flash package contents:"
          ls -lh flash_package/

      - name: Free space - remove extracted partition images
        if: steps.check.outputs.new_update == 'true'
        run: |
          rm -rf extracted super.img
          df -h /

      - name: Compress and split main VollaOS package
        if: steps.check.outputs.new_update == 'true'
        run: |
          cd flash_package
          echo "Compressing VollaOS flash package with 7z multi-volume..."
          7z a -v1900m -mx=6 ../volla-algiz-stable.7z *
          cd ..
          rm -rf flash_package
          echo "Parts created:"
          ls -lh volla-algiz-stable.7z.*
          df -h /

      - name: Build separate Ubuntu Touch dual-boot add-on package (Slot B)
        id: ut_dualboot
        if: steps.check.outputs.new_update == 'true' && inputs.build_ut_dualboot != false
        run: |
          set -euo pipefail
          mkdir -p ut_dualboot_package

          # 1. Fetch latest algiz-a15 Ubuntu Touch URLs dynamically from Volla ABM server
          python3 - << 'PYEOF' > ut_urls.env
          import requests, sys

          data = requests.get("https://abm.volla.tech/algiz-a15.json", timeout=60).json()
          ut = next((o for o in data.get("oses", []) if o.get("rtype") == "UT"), None)
          if not ut:
              sys.exit("FATAL: Ubuntu Touch (rtype=UT) entry not found in algiz-a15.json")

          inet = {item["id"]: item["url"] for item in ut.get("inet", [])}
          for key in ("ut", "boot", "vendor_boot", "init_boot"):
              if key not in inet:
                  sys.exit(f"FATAL: Missing {key} URL in algiz-a15.json")

          print(f'UT_VERSION="{ut.get("displayVersion", "unknown")}"')
          print(f'UT_SYSTEM_URL="{inet["ut"]}"')
          print(f'UT_BOOT_URL="{inet["boot"]}"')
          print(f'UT_VENDOR_BOOT_URL="{inet["vendor_boot"]}"')
          print(f'UT_INIT_BOOT_URL="{inet["init_boot"]}"')
          PYEOF

          cat ut_urls.env
          source ut_urls.env
          echo "ut_version=${UT_VERSION}" >> "$GITHUB_OUTPUT"

          # 2. Download boot, init_boot, vendor_boot, and system.img
          curl -fL --retry 3 --retry-delay 10 -o ut_dualboot_package/boot_ut.img "$UT_BOOT_URL"
          curl -fL --retry 3 --retry-delay 10 -o ut_dualboot_package/init_boot_ut.img "$UT_INIT_BOOT_URL"
          curl -fL --retry 3 --retry-delay 10 -o ut_dualboot_package/vendor_boot_ut.img "$UT_VENDOR_BOOT_URL"
          curl -fL --retry 3 --retry-delay 10 -o ut_dualboot_package/system_ut_raw.img "$UT_SYSTEM_URL"

          # 3. Ensure raw ext4, inject one-tap "Reboot to Android" icon & helper directly into UT rootfs
          if file ut_dualboot_package/system_ut_raw.img | grep -qi 'Android sparse'; then
            simg2img ut_dualboot_package/system_ut_raw.img ut_dualboot_package/system_ut_unsparse.img
            mv -f ut_dualboot_package/system_ut_unsparse.img ut_dualboot_package/system_ut_raw.img
          fi

          if file ut_dualboot_package/system_ut_raw.img | grep -qi 'ext[234]'; then
            echo "Injecting one-tap 'Reboot to Android' launcher icon into Ubuntu Touch rootfs..."
            if dumpe2fs -h ut_dualboot_package/system_ut_raw.img 2>/dev/null | grep -qi 'shared_blocks'; then
              e2fsck -E unshare_blocks -fy ut_dualboot_package/system_ut_raw.img || true
            fi
            e2fsck -fy ut_dualboot_package/system_ut_raw.img || true

            # Add 16 MiB headroom if image is tightly packed (staying safely under 10368709120 bytes)
            CUR_SZ=$(stat -c%s ut_dualboot_package/system_ut_raw.img)
            MAX_UT_SZ=10368709120
            if [ $((CUR_SZ + 16777216)) -le "$MAX_UT_SZ" ]; then
              truncate -s +16M ut_dualboot_package/system_ut_raw.img
              resize2fs ut_dualboot_package/system_ut_raw.img
            fi

            mkdir -p ut_mnt
            sudo mount -o loop,rw ut_dualboot_package/system_ut_raw.img ut_mnt

            sudo install -d -m 0755 -o 0 -g 0 ut_mnt/usr/local/sbin ut_mnt/usr/local/bin ut_mnt/usr/share/applications ut_mnt/usr/share/icons ut_mnt/etc/sudoers.d
            sudo install -m 0755 -o 0 -g 0 dualboot_artifacts/switch-slot ut_mnt/usr/local/sbin/switch-slot

            sudo install -d -m 0755 -o 0 -g 0 ut_mnt/usr/share/switch-to-vollaos
            sudo tee ut_mnt/usr/share/switch-to-vollaos/confirm.qml > /dev/null << 'QMLEOF'
          import QtQuick 2.4
          import Lomiri.Components 1.3
          import Lomiri.Components.Popups 1.3

          MainView {
              id: root
              applicationName: "switch-to-vollaos"
              width: units.gu(40)
              height: units.gu(60)

              Component {
                  id: confirmDialog
                  Dialog {
                      id: dlg
                      title: "Reboot to Android"
                      text: "Switch the active boot slot to Slot A (VollaOS) and reboot now?"
                      Button {
                          text: "Cancel"
                          onClicked: {
                              console.log("SWITCH_CANCELLED")
                              PopupUtils.close(dlg)
                              Qt.quit()
                          }
                      }
                      Button {
                          text: "Reboot to Android"
                          color: theme.palette.normal.positive
                          onClicked: {
                              console.log("SWITCH_CONFIRMED")
                              PopupUtils.close(dlg)
                              Qt.quit()
                          }
                      }
                  }
              }

              Component.onCompleted: {
                  PopupUtils.open(confirmDialog)
                  console.log("SWITCH_READY")
              }
          }
          QMLEOF
            sudo chmod 0644 ut_mnt/usr/share/switch-to-vollaos/confirm.qml
            sudo chown 0:0 ut_mnt/usr/share/switch-to-vollaos/confirm.qml

            # Ask "Are you sure?" first. Only an explicit tap on "Reboot to Android" continues.
            # If the dialog cannot be shown at all (no qmlscene / QML failed to load) the switch
            # runs directly, as before. Older Ubuntu Touch uses Ubuntu.Components instead of Lomiri.
            sudo tee ut_mnt/usr/local/bin/switch-to-vollaos > /dev/null << 'SHEOF'
          #!/bin/sh
          QML=/usr/share/switch-to-vollaos/confirm.qml
          if command -v qmlscene >/dev/null 2>&1 && [ -f "$QML" ]; then
            FILE=$QML
            if ! ls -d /usr/lib/*/qt5/qml/Lomiri/Components >/dev/null 2>&1; then
              FILE=/tmp/switch-to-vollaos-confirm.qml
              sed 's/Lomiri/Ubuntu/g' "$QML" > "$FILE"
            fi
            OUT=$(qmlscene "$FILE" 2>&1) || true
            case "$OUT" in
              *SWITCH_CONFIRMED*) ;;
              *SWITCH_READY*) exit 0 ;;
            esac
          fi
          exec sudo -n /usr/local/sbin/switch-slot 0 >>/tmp/switch-to-vollaos.log 2>&1
          SHEOF
            sudo chmod 0755 ut_mnt/usr/local/bin/switch-to-vollaos
            sudo chown 0:0 ut_mnt/usr/local/bin/switch-to-vollaos

            sudo tee ut_mnt/etc/sudoers.d/99-dualboot-switch > /dev/null << 'SUDOEOF'
          Defaults!/usr/local/sbin/switch-slot !requiretty
          phablet ALL=(ALL) NOPASSWD: /usr/local/sbin/switch-slot 0
          SUDOEOF
            sudo chmod 0440 ut_mnt/etc/sudoers.d/99-dualboot-switch
            sudo chown 0:0 ut_mnt/etc/sudoers.d/99-dualboot-switch

            sudo tee ut_mnt/usr/share/icons/switch-to-vollaos.svg > /dev/null << 'SVGEOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="30" fill="#1E88E5"/>
            <path fill="#FFFFFF" d="M22 28l-10 10 10 10v-7h18v-6H22v-7zm20-12v7H24v6h18v7l10-10-10-10z"/>
          </svg>
          SVGEOF
            sudo chmod 0644 ut_mnt/usr/share/icons/switch-to-vollaos.svg
            sudo chown 0:0 ut_mnt/usr/share/icons/switch-to-vollaos.svg

            sudo tee ut_mnt/usr/share/applications/switch-to-vollaos.desktop > /dev/null << 'DESKEOF'
          [Desktop Entry]
          Name=Reboot to Android
          Comment=Switch active boot slot to Slot A (VollaOS) and reboot
          Exec=/usr/local/bin/switch-to-vollaos
          Icon=/usr/share/icons/switch-to-vollaos.svg
          Terminal=false
          Type=Application
          NoDisplay=false
          X-Ubuntu-Touch=true
          X-Lomiri-Touch=true
          DESKEOF
            sudo chmod 0644 ut_mnt/usr/share/applications/switch-to-vollaos.desktop
            sudo chown 0:0 ut_mnt/usr/share/applications/switch-to-vollaos.desktop

            sudo sync
            sudo umount ut_mnt
            rmdir ut_mnt
            e2fsck -fy ut_dualboot_package/system_ut_raw.img || true
            echo "Successfully baked 'Reboot to Android' icon into Ubuntu Touch rootfs."
          else
            echo "WARNING: system_ut_raw.img is not ext4 ($(file -b ut_dualboot_package/system_ut_raw.img)); skipping rootfs icon injection."
          fi

          # 4. Convert raw system.img to Android sparse format for fast, reliable fastboot flashing & smaller zip
          echo "Converting Ubuntu Touch system.img to Android sparse image..."
          img2simg ut_dualboot_package/system_ut_raw.img ut_dualboot_package/system_ut.img
          rm -f ut_dualboot_package/system_ut_raw.img
          ls -lh ut_dualboot_package/

          # 5. Patch vendor_boot_ut.img v4 cmdline in-place (preserves v4 multi-fragment ramdisk & recovery)
          python3 - << 'PYEOF'
          import struct
          from pathlib import Path

          p = Path("ut_dualboot_package/vendor_boot_ut.img")
          vb = bytearray(p.read_bytes())

          if vb[:8] != b"VNDRBOOT":
              raise SystemExit("FATAL: vendor_boot_ut.img does not start with VNDRBOOT")
          hver = struct.unpack_from("<I", vb, 8)[0]
          if hver < 3:
              raise SystemExit(f"FATAL: unsupported vendor_boot header version: {hver}")
          bc_sz = struct.unpack_from("<I", vb, 2124)[0] if hver >= 4 else 0
          if bc_sz != 0:
              raise SystemExit(f"FATAL: unexpected non-zero bootconfig_size={bc_sz}; inspect before patching")

          old_cmd = bytes(vb[28:2076]).split(b"\x00", 1)[0].decode("ascii")
          print("Original vendor_cmdline:", old_cmd)

          tokens = [
              t for t in old_cmd.split()
              if not t.startswith(("systempart=", "datapart=", "ABM.bootloader="))
          ]
          tokens.append("systempart=/dev/disk/by-partlabel/linux_system")
          tokens.append("datapart=/dev/disk/by-partlabel/linux_data")
          new_cmd = " ".join(tokens)
          new_bytes = new_cmd.encode("ascii")
          if len(new_bytes) >= 2048:
              raise SystemExit("FATAL: patched vendor_cmdline exceeds 2047 bytes")

          vb[28:2076] = new_bytes.ljust(2048, b"\x00")
          p.write_bytes(vb)

          verify_cmd = p.read_bytes()[28:2076].split(b"\x00", 1)[0].decode("ascii")
          print("Patched  vendor_cmdline:", verify_cmd)
          PYEOF

          # 6. Bundle Windows platform-tools and Dual-Boot flash scripts
          cp -a platform-tools ut_dualboot_package/platform-tools
          rm -rf platform-tools
          cp -f flash/prepare_gpt.sh ut_dualboot_package/prepare_gpt.sh
          cp -f flash/gpt_edit.py ut_dualboot_package/gpt_edit.py
          cp -f flash/prepare_gpt.bat ut_dualboot_package/prepare_gpt.bat
          chmod +x ut_dualboot_package/prepare_gpt.sh

          cat << 'SHEOF' > ut_dualboot_package/flash_ut_slot_b.sh
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "$0")" && pwd)"
          FASTBOOT="fastboot"
          [ -x "$DIR/platform-tools/fastboot" ] && FASTBOOT="$DIR/platform-tools/fastboot"

          echo "================================================================"
          echo "  Ubuntu Touch Dual-Boot Installer (Slot B) for Daria Bond"
          echo "  - Keeps VollaOS 16 untouched on Slot A"
          echo "  - Includes built-in 'Reboot to Android' one-tap app icon"
          echo "  Prerequisite: GPT partitions 'linux_system' & 'linux_data' (run prepare_gpt.sh first)"
          echo "================================================================"
          read -r -p "Type YES to flash Ubuntu Touch to Slot B: " CONFIRM
          [ "$CONFIRM" = "YES" ] || { echo "Aborted."; exit 1; }

          read -r -p "Format 'linux_data'? (Type YES for FIRST install, NO for update): " WIPE_DATA

          "$FASTBOOT" flash boot_b "$DIR/boot_ut.img"
          "$FASTBOOT" flash init_boot_b "$DIR/init_boot_ut.img"
          "$FASTBOOT" flash vendor_boot_b "$DIR/vendor_boot_ut.img"
          "$FASTBOOT" flash linux_system "$DIR/system_ut.img"

          if [ "$WIPE_DATA" = "YES" ]; then
            echo "Erasing linux_data (Halium initrd will auto-format it as ext4 on first boot)..."
            "$FASTBOOT" erase linux_data
          fi

          "$FASTBOOT" set_active b
          echo "Done! Rebooting to recovery (Slot B)..."
          "$FASTBOOT" reboot recovery
          SHEOF
          chmod +x ut_dualboot_package/flash_ut_slot_b.sh

          cat << 'BATEOF' > ut_dualboot_package/flash_ut_slot_b.bat
          @echo off
          setlocal
          set "DIR=%~dp0"
          set "FASTBOOT=%DIR%platform-tools\fastboot.exe"
          if not exist "%FASTBOOT%" set "FASTBOOT=fastboot"

          echo ================================================================
          echo   Ubuntu Touch Dual-Boot Installer (Slot B) for Daria Bond
          echo   - Keeps VollaOS 16 untouched on Slot A
          echo   - Includes built-in 'Reboot to Android' one-tap app icon
          echo   Prerequisite: GPT partitions 'linux_system' ^& 'linux_data' ^(run prepare_gpt.sh first^)
          echo ================================================================
          set /p CONFIRM=Type YES to flash Ubuntu Touch to Slot B: 
          if /I not "%CONFIRM%"=="YES" (
              echo Aborted.
              pause
              exit /b 1
          )

          set /p WIPE_DATA=Format 'linux_data'? (Type YES for FIRST install, NO for update): 

          "%FASTBOOT%" flash boot_b "%DIR%boot_ut.img" || goto :err
          "%FASTBOOT%" flash init_boot_b "%DIR%init_boot_ut.img" || goto :err
          "%FASTBOOT%" flash vendor_boot_b "%DIR%vendor_boot_ut.img" || goto :err
          "%FASTBOOT%" flash linux_system "%DIR%system_ut.img" || goto :err

          if /I "%WIPE_DATA%"=="YES" (
              echo Erasing linux_data...
              "%FASTBOOT%" erase linux_data || goto :err
          )

          "%FASTBOOT%" set_active b || goto :err
          echo DONE! Rebooting to recovery ^(Slot B^)...
          "%FASTBOOT%" reboot recovery
          pause
          exit /b 0

          :err
          echo.
          echo ERROR occurred while flashing! Do NOT reboot until resolved.
          pause
          exit /b 1
          BATEOF

          # 7. Package as a standalone .zip (fall back to split 7z only if > 1900 MiB for GitHub 2 GiB limit)
          cd ut_dualboot_package
          zip -6 -r ../volla-algiz-ubuntu-touch-dualboot.zip .
          cd ..
          rm -rf ut_dualboot_package ut_urls.env

          ZIP_SIZE=$(stat -c%s volla-algiz-ubuntu-touch-dualboot.zip)
          echo "Ubuntu Touch dual-boot zip size: $ZIP_SIZE bytes"
          if [ "$ZIP_SIZE" -gt 1992294400 ]; then
            echo "Zip exceeds 1900 MiB GitHub Release limit; splitting into 7z parts..."
            mkdir -p tmp_repack && unzip -q volla-algiz-ubuntu-touch-dualboot.zip -d tmp_repack
            rm -f volla-algiz-ubuntu-touch-dualboot.zip
            (cd tmp_repack && 7z a -v1900m -mx=6 ../volla-algiz-ubuntu-touch-dualboot.7z *)
            rm -rf tmp_repack
          fi
          ls -lh volla-algiz-ubuntu-touch-dualboot.*
          df -h /

      - name: Clean up temporary build artifacts
        if: steps.check.outputs.new_update == 'true'
        run: rm -rf platform-tools dualboot_artifacts

      - name: Create GitHub Release
        if: steps.check.outputs.new_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-${{ steps.check.outputs.version_date }}
          name: "Volla Algiz Stable ${{ steps.check.outputs.version_date }}"
          body: |
            ## VollaOS ${{ steps.check.outputs.version }} (${{ steps.check.outputs.date_formatted }}) for Daria Bond (`zahedan`)

            * **Main ROM (`volla-algiz-stable.7z.*`):** VollaOS with DariaOS `preloader`/`lk`, dual-boot ready `super.img`, stock Updater & unsafe Multi-Boot removed, and built-in **Switch to Linux** app + Quick Settings tile.
            * **Ubuntu Touch Add-on (`volla-algiz-ubuntu-touch-dualboot.zip`):** Ready-to-flash Slot B dual-boot package (`${{ steps.ut_dualboot.outputs.ut_version }}`) with built-in **Reboot to Android** app icon.

            See the repository **`README.md`** for full installation, partitioning, and dual-boot instructions.
          files: |
            volla-algiz-stable.7z.*
            volla-algiz-ubuntu-touch-dualboot.*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download screenshot image
        if: steps.check.outputs.new_update == 'true'
        run: |
          curl -L -o screenshot.png "https://z-cdn-media.chatglm.cn/files/40c1865c-a678-4635-8d1a-e825b6a98a9e.png?auth_key=1888329201-ece16c0436304cbeb954220220bc5d02-0-bcddfa18ea7eab497ac6333cc14dd176"
          if [ ! -f screenshot.png ] || [ ! -s screenshot.png ]; then
              echo "WARNING: Failed to download screenshot, will send text-only message"
              echo "HAS_SCREENSHOT=false" >> "$GITHUB_ENV"
          else
              echo "HAS_SCREENSHOT=true" >> "$GITHUB_ENV"
              echo "Screenshot downloaded: $(du -h screenshot.png | cut -f1)"
          fi

      - name: Send Telegram notification
        if: steps.check.outputs.new_update == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/stable-${{ steps.check.outputs.version_date }}"

          cat > caption.txt << 'CAPEOF'
          #VollaOS #Rom #Port #Unofficial #U #zahedan

          <b><u>VollaOS __VERSION__ | Android __ANDROID_MAJOR__.</u></b>
          <b>Updated: __DATE__</b>

          <blockquote>• Updater &amp; unsafe stock Multi-Boot removed
          • Linux Mobile Dual-Boot ready + One-tap OS Switcher built-in
          • Separate Ubuntu Touch Slot B zip included
          • Don’t use ADB sideload for updates!</blockquote>

          ×| <a href="__RELEASE_URL__">Download</a>
          ×| <a href="https://t.me/dariabond_group/166487">Screenshot</a>
          ×| <a href="https://t.me/dariabond_group/172813">Flashing Guide</a>

          <b>Bugs:</b>
          <blockquote>• You tell me</blockquote>

          <b>Notes:</b>
          <blockquote>• Vanilla build
          • To enable UDFPS while the screen is off, see the #udfps_longpress_screenoff note
          • MicroG included
          • Back up important partitions (see the #important_backups note)
          • Report bugs with proper logs</blockquote>

          <blockquote><i>⚠ This ROM is built automatically and may brick your device. Flash at your own risk.</i></blockquote>

          By @Itis_sajjad

          @dariabond_updates | @dariabond_group
          CAPEOF

          sed -i "s|__VERSION__|${{ steps.check.outputs.version }}|g" caption.txt
          sed -i "s|__ANDROID_MAJOR__|${{ steps.check.outputs.android_major }}|g" caption.txt
          sed -i "s|__DATE__|${{ steps.check.outputs.date_formatted }}|g" caption.txt
          sed -i "s|__RELEASE_URL__|${RELEASE_URL}|g" caption.txt

          if [ "$HAS_SCREENSHOT" = "true" ]; then
              echo "Sending photo message to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "photo=@screenshot.png" \
                -F "caption=<caption.txt" \
                -F "parse_mode=HTML" \
                -F "disable_web_page_preview=true"
          else
              echo "Sending text-only message to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "text=<caption.txt" \
                -F "parse_mode=HTML" \
                -F "disable_web_page_preview=true"
          fi
          echo "Telegram notification sent."

      - name: Save version state
        if: steps.check.outputs.new_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_version.txt
          git commit -m "Update last stable version to ${{ steps.check.outputs.version_date }}" || true
          git push
