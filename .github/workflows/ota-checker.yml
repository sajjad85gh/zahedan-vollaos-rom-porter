name: Volla Algiz OTA Checker

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Install payload-dumper-go
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq liblzma-dev
          go install github.com/ssut/payload-dumper-go@v0.0.0-20260820001620-05fe59e21c9f
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Write OTA checker script
        run: |
          cat << 'PYEOF' > check_ota.py
          #!/usr/bin/env python3
          """Check Volla OTA server for new stable updates for the Algiz device."""

          import os
          import re
          import sys
          import requests
          from bs4 import BeautifulSoup

          OTA_BASE_URL = "https://ota.volla.tech/"
          DEVICE = "algiz"
          CHANNEL = "stable"
          STATE_FILE = "last_version.txt"

          UPDATE_PATTERN = re.compile(
              r'volla-([\d.]+)-(\d{8})-' + re.escape(CHANNEL) + r'-' + re.escape(DEVICE) + r'-signed\.zip',
              re.IGNORECASE
          )

          def fetch_page(url):
              try:
                  resp = requests.get(url, timeout=60, headers={
                      "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
                  })
                  resp.raise_for_status()
                  return resp
              except requests.RequestException as e:
                  print(f"Error fetching {url}: {e}")
                  return None

          def parse_html(html):
              soup = BeautifulSoup(html, "html.parser")
              updates = []
              for a_tag in soup.find_all("a", href=True):
                  href = a_tag["href"]
                  filename = href.split("/")[-1]
                  match = UPDATE_PATTERN.search(filename)
                  if match:
                      version_str = match.group(1)
                      date_str = match.group(2)
                      if href.startswith("http"):
                          full_url = href
                      else:
                          full_url = OTA_BASE_URL.rstrip("/") + "/" + href.lstrip("/")
                      updates.append((version_str, date_str, full_url))
              return updates

          def parse_json(data):
              updates = []
              items = data if isinstance(data, list) else data.get("files", data.get("updates", []))
              for item in items:
                  if isinstance(item, dict):
                      name = item.get("name", item.get("url", item.get("filename", "")))
                      url = item.get("url", item.get("download_url", name))
                  else:
                      name = str(item)
                      url = name
                  match = UPDATE_PATTERN.search(name)
                  if match:
                      version_str = match.group(1)
                      date_str = match.group(2)
                      if not url.startswith("http"):
                          url = OTA_BASE_URL.rstrip("/") + "/" + url.lstrip("/")
                      updates.append((version_str, date_str, url))
              return updates

          def get_available_updates():
              resp = fetch_page(OTA_BASE_URL)
              if resp is None:
                  return []
              content_type = resp.headers.get("Content-Type", "")
              if "json" in content_type:
                  try:
                      return parse_json(resp.json())
                  except (ValueError, KeyError):
                      pass
              return parse_html(resp.text)

          def get_last_version():
              if os.path.exists(STATE_FILE):
                  with open(STATE_FILE, "r") as f:
                      return f.read().strip()
              return ""

          def set_output(name, value):
              github_output = os.environ.get("GITHUB_OUTPUT")
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{name}={value}\n")
              else:
                  print(f"::set-output name={name}::{value}")

          def main():
              print("Checking Volla OTA server for stable Algiz updates...")
              updates = get_available_updates()
              if not updates:
                  print("No stable updates found for Algiz.")
                  set_output("new_update", "false")
                  return 0

              updates.sort(key=lambda x: x[1], reverse=True)
              latest_version, latest_date, latest_url = updates[0]
              print(f"Found {len(updates)} stable update(s). Latest: v{latest_version} ({latest_date})")

              last_version = get_last_version()
              if last_version and latest_date <= last_version:
                  print(f"Already processed version {last_version}. No new update.")
                  set_output("new_update", "false")
                  return 0

              print(f"New update available: {latest_url}")
              set_output("new_update", "true")
              set_output("download_url", latest_url)
              set_output("version", latest_version)
              set_output("version_date", latest_date)
              set_output("date_formatted", f"{latest_date[:4]}/{latest_date[4:6]}/{latest_date[6:8]}")
              set_output("android_major", latest_version.split(".")[0])

              with open(STATE_FILE, "w") as f:
                  f.write(latest_date)
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF


      - name: Check for new stable update
        id: check
        run: python check_ota.py

      - name: Download OTA zip
        if: steps.check.outputs.new_update == 'true'
        run: |
          echo "Downloading ${{ steps.check.outputs.download_url }} ..."
          curl -L --retry 3 --retry-delay 10 -o ota.zip "${{ steps.check.outputs.download_url }}"
          echo "Download size: $(du -h ota.zip | cut -f1)"

      - name: Dump OTA payload
        if: steps.check.outputs.new_update == 'true'
        run: |
          mkdir -p extracted
          "$HOME/go/bin/payload-dumper-go" -o extracted ota.zip
          echo "Extracted files:"
          ls -lh extracted/

      - name: Free space - remove OTA zip
        if: steps.check.outputs.new_update == 'true'
        run: rm -f ota.zip

      - name: Free disk space
        if: steps.check.outputs.new_update == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android
          df -h /
          
      - name: Install Android Image Tools dependencies
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -e
          export TERM=xterm-256color
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            android-sdk-libsparse-utils \
            build-essential \
            automake \
            autoconf \
            libtool \
            pkg-config \
            git \
            fuse3 \
            e2fsprogs \
            pv \
            liblz4-dev \
            uuid-dev \
            libfuse3-dev \
            f2fs-tools \
            fuse2fs \
            attr \
            zlib1g-dev \
            rsync
          if ! command -v mkfs.erofs >/dev/null || ! command -v erofsfuse >/dev/null; then
            git clone --depth 1 https://github.com/erofs/erofs-utils.git /tmp/erofs-utils
            cd /tmp/erofs-utils
            ./autogen.sh
            ./configure --enable-fuse
            make -j"$(nproc)"
            sudo make install
            sudo ldconfig
            cd -
            rm -rf /tmp/erofs-utils
          fi

      - name: Clone Android Image Tools
        if: steps.check.outputs.new_update == 'true'
        run: git clone --branch v4 --depth 1 https://github.com/ravindu644/Android_Image_Tools.git

      - name: Add my name to settings and remove stock Updater
        if: steps.check.outputs.new_update == 'true'
        run: |
          set -e
          export TERM=xterm-256color
          AIT="Android_Image_Tools"
          cp extracted/system.img "$AIT/INPUT_IMAGES/system.img"
          cp extracted/product.img "$AIT/INPUT_IMAGES/product.img"
          cp extracted/system_ext.img "$AIT/INPUT_IMAGES/system_ext.img"
          cd "$AIT"
          for part in system product system_ext; do
            cat > "CONFIGS/unpack_${part}.conf" << EOF
          ACTION=unpack
          INPUT_IMAGE=${part}.img
          EXTRACT_DIR=extracted_${part}
          EOF
            sudo --preserve-env=TERM ./android_image_tools.sh --conf="CONFIGS/unpack_${part}.conf"
          done
          while IFS= read -r f; do
            sudo sed -i -E 's/^(ro\.volla\.build\.version=.*-)algiz$/\1By @Itis_Sajjad/' "$f"
          done < <(sudo grep -RIl --include='*.prop' '^ro\.volla\.build\.version=' EXTRACTED_IMAGES/extracted_system || true)
          while IFS= read -r f; do
            sudo sed -i -E 's/^(ro\.lineage\.version=.*-)algiz$/\1By @Itis_Sajjad/' "$f"
          done < <(sudo grep -RIl --include='*.prop' '^ro\.lineage\.version=' EXTRACTED_IMAGES/extracted_product EXTRACTED_IMAGES/extracted_system || true)
          sudo grep -R --include='*.prop' -nE 'ro\.(volla\.build|lineage)\.version=' EXTRACTED_IMAGES/extracted_system EXTRACTED_IMAGES/extracted_product || true
          sudo find EXTRACTED_IMAGES/extracted_system_ext EXTRACTED_IMAGES/extracted_system EXTRACTED_IMAGES/extracted_product -type d -path '*/priv-app/Updater' -prune -exec rm -rf {} + 2>/dev/null || true
          for part in system product system_ext; do
            cat > "CONFIGS/repack_${part}.conf" << EOF
          ACTION=repack
          SOURCE_DIR=extracted_${part}
          OUTPUT_IMAGE=${part}_new.img
          FILESYSTEM=erofs
          COMPRESSION_MODE=lz4hc
          COMPRESSION_LEVEL=9
          CREATE_SPARSE_IMAGE=false
          EOF
            sudo --preserve-env=TERM ./android_image_tools.sh --conf="CONFIGS/repack_${part}.conf"
          done
          cd ..
          cp "$AIT/REPACKED_IMAGES/system_new.img" extracted/system.img
          cp "$AIT/REPACKED_IMAGES/product_new.img" extracted/product.img
          cp "$AIT/REPACKED_IMAGES/system_ext_new.img" extracted/system_ext.img
          ls -lh extracted/system.img extracted/product.img extracted/system_ext.img
          
      - name: Install lpmake
        run: |
          curl -fL -o lpmake "https://raw.githubusercontent.com/Rprop/aosp15_partition_tools/main/linux_glibc_x86_64/lpmake"
          chmod +x lpmake
          ./lpmake --help || true

      - name: Build super image
        if: steps.check.outputs.new_update == 'true'
        run: |
          find_image() {
            for suffix in "_a" ""; do
              [ -f "extracted/$1${suffix}.img" ] && { echo "extracted/$1${suffix}.img"; return; }
            done
          }

          SUPER_SIZE=7516192768
          ARGS=""
          ARGS="$ARGS --group mtk_dynamic_partitions_a:${SUPER_SIZE}"
          ARGS="$ARGS --group mtk_dynamic_partitions_b:${SUPER_SIZE}"

          for p in odm_dlkm product system system_dlkm system_ext vendor vendor_dlkm; do
            img=$(find_image "$p")
            if [ -z "$img" ]; then
              echo "WARNING: $p missing — emitting empty _a/_b entries"
              ARGS="$ARGS --partition ${p}_a:none:0:mtk_dynamic_partitions_a"
              ARGS="$ARGS --partition ${p}_b:none:0:mtk_dynamic_partitions_b"
              continue
            fi
            size=$(stat -c%s "$img")
            echo "Using $img ($size bytes) -> ${p}_a"
            ARGS="$ARGS --partition ${p}_a:none:${size}:mtk_dynamic_partitions_a"
            ARGS="$ARGS --image ${p}_a=${img}"
            ARGS="$ARGS --partition ${p}_b:none:0:mtk_dynamic_partitions_b"
          done

          ./lpmake \
            --metadata-size 65536 \
            --metadata-slots 3 \
            --device-size "${SUPER_SIZE}" \
            --super-name super \
            $ARGS \
            --virtual-ab \
            --sparse \
            --output super.img

          echo "===== lpmake done, super.img size: $(stat -c%s super.img) ====="

      - name: Prepare flash package
        if: steps.check.outputs.new_update == 'true'
        run: |
          mkdir -p flash_package
          cp super.img flash_package/
          MISSING=0
          for img in boot init_boot vendor_boot dtbo vbmeta vbmeta_system vbmeta_vendor md1img; do
              FOUND=0
              for suffix in "" "_a"; do
                  if [ -f "extracted/${img}${suffix}.img" ]; then
                      cp "extracted/${img}${suffix}.img" "flash_package/${img}.img"
                      FOUND=1
                      echo "Found ${img}${suffix}.img"
                      break
                  fi
              done
              if [ "$FOUND" = "0" ]; then
                  echo "WARNING: ${img}.img not found in extracted files"
                  MISSING=1
              fi
          done
          cat > flash_package/commands.txt << 'CMDEOF'
          Flash DariaOS 6 then reboot to bootloader;
          fastboot flash super super.img
          fastboot flash boot_b boot.img
          fastboot flash init_boot_b init_boot.img
          fastboot flash dtbo_b dtbo.img
          fastboot flash vendor_boot_b vendor_boot.img
          fastboot --disable-verity --disable-verification flash vbmeta_b vbmeta.img
          fastboot --disable-verity --disable-verification flash vbmeta_system_b vbmeta_system.img
          fastboot --disable-verity --disable-verification flash vbmeta_vendor_b vbmeta_vendor.img
          fastboot flash md1img_b md1img.img
          fastboot flash boot_a boot.img
          fastboot flash init_boot_a init_boot.img
          fastboot flash dtbo_a dtbo.img
          fastboot flash vendor_boot_a vendor_boot.img
          fastboot --disable-verity --disable-verification flash vbmeta_a vbmeta.img
          fastboot --disable-verity --disable-verification flash vbmeta_system_a vbmeta_system.img
          fastboot --disable-verity --disable-verification flash vbmeta_vendor_a vbmeta_vendor.img
          fastboot flash md1img_a md1img.img
          fastboot --set-active=a

          CMDEOF
          echo "Flash package contents:"
          ls -lh flash_package/
          if [ "$MISSING" = "1" ]; then
              echo ""
              echo "NOTE: Some images were missing from the OTA payload."
              echo "The flash package is incomplete. Check the warnings above."
          fi

      - name: Free space - remove extracted partition images
        if: steps.check.outputs.new_update == 'true'
        run: |
          for p in system system_ext system_dlkm vendor vendor_dlkm product odm_dlkm; do
              rm -f "extracted/${p}.img" "extracted/${p}_a.img"
          done
          rm -f extracted/payload.bin
          echo "Remaining in extracted/:"
          ls -lh extracted/ 2>/dev/null || echo "(empty or removed)"

      - name: Compress and split for upload
        if: steps.check.outputs.new_update == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          cd flash_package
          echo "Compressing with 7z multi-volume..."
          7z a -v1900m -mx=6 ../volla-algiz-stable.7z *
          cd ..
          echo "Parts created:"
          ls -lh volla-algiz-stable.7z.*

      - name: Create GitHub Release
        if: steps.check.outputs.new_update == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stable-${{ steps.check.outputs.version_date }}
          name: "Volla Algiz Stable ${{ steps.check.outputs.version_date }}"
          body: |
            ## Download & Extract
            **Linux/Mac:**
            ```bash
            7z x volla-algiz-stable.7z.001
            ```
            **Windows:**
            Right-click on `volla-algiz-stable.7z.001` → Extract with 7-Zip

            > All parts must be in the same folder. Only extract the `.001` file, the rest are loaded automatically.

            ## Flash
            See `commands.txt` inside the extracted folder for fastboot commands.
          files: volla-algiz-stable.7z.*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download screenshot image
        if: steps.check.outputs.new_update == 'true'
        run: |
          curl -L -o screenshot.png "https://z-cdn-media.chatglm.cn/files/40c1865c-a678-4635-8d1a-e825b6a98a9e.png?auth_key=1888329201-ece16c0436304cbeb954220220bc5d02-0-bcddfa18ea7eab497ac6333cc14dd176"
          if [ ! -f screenshot.png ] || [ ! -s screenshot.png ]; then
              echo "WARNING: Failed to download screenshot, will send text-only message"
              echo "HAS_SCREENSHOT=false" >> "$GITHUB_ENV"
          else
              echo "HAS_SCREENSHOT=true" >> "$GITHUB_ENV"
              echo "Screenshot downloaded: $(du -h screenshot.png | cut -f1)"
          fi

      - name: Send Telegram notification
        if: steps.check.outputs.new_update == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/stable-${{ steps.check.outputs.version_date }}"

          cat > caption.txt << 'CAPEOF'
          #VollaOS #Rom #Port #Unofficial #U #zahedan

          <b><u>VollaOS __VERSION__ | Android __ANDROID_MAJOR__.</u></b>
          <b>Updated: __DATE__</b>

          <blockquote>• requirement: DariaOS 6 (android 15)

          ×| <a href="__RELEASE_URL__">Download</a>
          ×| <a href="https://t.me/dariabond_group/166487">Screenshot</a>
          ×| <a href="https://t.me/dariabond_group/172813">Flash guide</a>

          <b>Bugs:</b>
          • you tell me

          <b>Notes:</b>
          <blockquote>• Vanilla build
          • to add udfps screenoff see #udfps_longpress_screenoff note
          • MicroG included
          • backup important partitions (see #important_backups note)
          • Report bug with proper log</blockquote>

          <blockquote><i>⚠ This ROM is built automatically and may brick your device. Flash at your own risk.</i></blockquote>

          By @Itis_sajjad

          @dariabond_updates | @dariabond_group
          CAPEOF

          sed -i "s|__VERSION__|${{ steps.check.outputs.version }}|g" caption.txt
          sed -i "s|__ANDROID_MAJOR__|${{ steps.check.outputs.android_major }}|g" caption.txt
          sed -i "s|__DATE__|${{ steps.check.outputs.date_formatted }}|g" caption.txt
          sed -i "s|__RELEASE_URL__|${RELEASE_URL}|g" caption.txt

          if [ "$HAS_SCREENSHOT" = "true" ]; then
              echo "Sending photo message to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "photo=@screenshot.png" \
                -F "caption=<caption.txt" \
                -F "parse_mode=HTML" \
                -F "disable_web_page_preview=true"
          else
              echo "Sending text-only message to Telegram..."
              curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -F "chat_id=${TELEGRAM_CHAT_ID}" \
                -F "text=<caption.txt" \
                -F "parse_mode=HTML" \
                -F "disable_web_page_preview=true"
          fi
          echo "Telegram notification sent."

      - name: Save version state
        if: steps.check.outputs.new_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add last_version.txt
          git commit -m "Update last stable version to ${{ steps.check.outputs.version_date }}" || true
          git push